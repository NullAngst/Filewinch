binaries = ["tsanalyze"]
version_cmd = ["tsanalyze", "--version"]
# Not in the main repos. Install from github.com/tsduck/tsduck/releases (.deb or .rpm) or the AUR.
packages = { apt = "", dnf = "", zypper = "", pacman = "" }
upstream_note = "Download the .deb or .rpm from github.com/tsduck/tsduck/releases, or install tsduck from the AUR."

[tools.mp3val]
required = false
feature = "MP3 frame repair"
binaries = ["mp3val"]
version_cmd = ["mp3val"]
packages = { apt = "mp3val", dnf = "", zypper = "", pacman = "" }
upstream_note = "Packaged on Debian and Ubuntu only. On Arch install mp3val from the AUR; elsewhere build it from mp3val.sourceforge.net. ffmpeg remux covers MP3 without it."

[tools.flac]
