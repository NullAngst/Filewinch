# Every external tool FileWinch calls.
#
# required    true: a job cannot start without it. false: it switches on a feature.
# binaries    names to look for with PATH lookup. The first one found is used.
# feature     what the tool unlocks, shown on the Dependencies tab.
# group       tools sharing a group satisfy each other (pkexec or sudo, any terminal).
# version_cmd how to ask the tool its version. Output is searched with version_re.
# min_version CVE-tied minimum. Older installs show amber, nothing is blocked,
#             since distros like Fedora backport fixes into older version numbers.
# packages    package name per package manager. An empty string means the
#             distro does not package it; deps-check in CI skips those.
# bundled     true: shipped inside the AppImage, looked up in $APPDIR first.
#
# Package names are best current knowledge. The CI deps-check job installs every
# one of these on each distro's current image, which is what keeps them honest.

[tools.lsblk]
required = true
feature = "Device listing"
binaries = ["lsblk"]
version_cmd = ["lsblk", "--version"]
packages = { apt = "util-linux", dnf = "util-linux", zypper = "util-linux", pacman = "util-linux" }

[tools.sfdisk]
required = true
feature = "Partition table backup"
binaries = ["sfdisk"]
version_cmd = ["sfdisk", "--version"]
packages = { apt = "fdisk", dnf = "util-linux", zypper = "util-linux", pacman = "util-linux" }

[tools.pkexec]
required = true
group = "privilege"
feature = "Root access for raw device reads"
binaries = ["pkexec"]
version_cmd = ["pkexec", "--version"]
packages = { apt = "pkexec", dnf = "polkit", zypper = "polkit", pacman = "polkit" }

[tools.sudo]
required = true
group = "privilege"
feature = "Root access fallback when pkexec is missing"
binaries = ["sudo"]
version_cmd = ["sudo", "--version"]
packages = { apt = "sudo", dnf = "sudo", zypper = "sudo", pacman = "sudo" }

[tools.smartctl]
required = true
feature = "Drive health check"
binaries = ["smartctl"]
version_cmd = ["smartctl", "--version"]
packages = { apt = "smartmontools", dnf = "smartmontools", zypper = "smartmontools", pacman = "smartmontools" }

[tools.ddrescue]
required = true
feature = "Imaging drives and discs"
binaries = ["ddrescue"]
version_cmd = ["ddrescue", "--version"]
packages = { apt = "gddrescue", dnf = "ddrescue", zypper = "gnu_ddrescue", pacman = "ddrescue" }

[tools.testdisk]
required = true
feature = "Partition table repair, undelete fallback"
binaries = ["testdisk"]
version_cmd = ["testdisk", "/version"]
packages = { apt = "testdisk", dnf = "testdisk", zypper = "testdisk", pacman = "testdisk" }

[tools.photorec]
required = true
feature = "Signature carving"
binaries = ["photorec"]
version_cmd = ["photorec", "/version"]
packages = { apt = "testdisk", dnf = "testdisk", zypper = "testdisk", pacman = "testdisk" }

[tools.fidentify]
required = true
feature = "Real file type identification"
binaries = ["fidentify"]
version_cmd = ["fidentify", "/version"]
packages = { apt = "testdisk", dnf = "testdisk", zypper = "testdisk", pacman = "testdisk" }

[tools.fls]
required = true
feature = "Named undelete (Sleuth Kit)"
binaries = ["fls"]
version_cmd = ["fls", "-V"]
# Sleuth Kit CVE-2026-40024 to 40026. 4.15.0 is the first version I could
# confirm carries the fixes (Arch's package). Check upstream when you bump this.
min_version = "4.15.0"
cve = "CVE-2026-40024, CVE-2026-40025, CVE-2026-40026"
packages = { apt = "sleuthkit", dnf = "sleuthkit", zypper = "sleuthkit", pacman = "sleuthkit" }

[tools.icat]
required = true
feature = "Named undelete (Sleuth Kit)"
binaries = ["icat"]
version_cmd = ["icat", "-V"]
packages = { apt = "sleuthkit", dnf = "sleuthkit", zypper = "sleuthkit", pacman = "sleuthkit" }

[tools.mmls]
required = true
feature = "Partition layout of images"
binaries = ["mmls"]
version_cmd = ["mmls", "-V"]
packages = { apt = "sleuthkit", dnf = "sleuthkit", zypper = "sleuthkit", pacman = "sleuthkit" }

[tools.fsstat]
required = true
feature = "Filesystem detection"
binaries = ["fsstat"]
version_cmd = ["fsstat", "-V"]
packages = { apt = "sleuthkit", dnf = "sleuthkit", zypper = "sleuthkit", pacman = "sleuthkit" }

[tools.file]
required = true
feature = "Type identification"
binaries = ["file"]
version_cmd = ["file", "--version"]
packages = { apt = "file", dnf = "file", zypper = "file", pacman = "file" }

[tools.ffmpeg]
required = true
feature = "Video and audio decode check, remux, re-encode"
binaries = ["ffmpeg"]
version_cmd = ["ffmpeg", "-version"]
packages = { apt = "ffmpeg", dnf = "ffmpeg-free", zypper = "ffmpeg", pacman = "ffmpeg" }
limited_note = "This ffmpeg leaves out patent-encumbered codecs. On Fedora enable RPM Fusion and run: sudo dnf swap ffmpeg-free ffmpeg --allowerasing. On openSUSE add the Packman repository and run: sudo zypper install --from packman ffmpeg"

[tools.ffprobe]
required = true
feature = "Media probing"
binaries = ["ffprobe"]
version_cmd = ["ffprobe", "-version"]
packages = { apt = "ffmpeg", dnf = "ffmpeg-free", zypper = "ffmpeg", pacman = "ffmpeg" }

[tools.ntfsundelete]
required = false
feature = "NTFS undelete second opinion"
binaries = ["ntfsundelete"]
version_cmd = ["ntfsundelete", "--version"]
packages = { apt = "ntfs-3g", dnf = "ntfsprogs", zypper = "ntfsprogs", pacman = "ntfs-3g" }

[tools.btrfs]
required = false
feature = "Btrfs old-tree restore"
binaries = ["btrfs"]
version_cmd = ["btrfs", "--version"]
packages = { apt = "btrfs-progs", dnf = "btrfs-progs", zypper = "btrfsprogs", pacman = "btrfs-progs" }

[tools.cdparanoia]
required = false
feature = "Audio CD rescue"
binaries = ["cdparanoia"]
version_cmd = ["cdparanoia", "--version"]
packages = { apt = "cdparanoia", dnf = "cdparanoia", zypper = "cdparanoia", pacman = "cdparanoia" }

[tools.vcdxrip]
