[tools.mkvmerge]
required = false
feature = "MKV inspect and rebuild"
binaries = ["mkvmerge"]
version_cmd = ["mkvmerge", "--version"]
version_re = 'v(\d+\.\d+(?:\.\d+)?)'
# Heap overflow in the AVI parser, fixed in 102.0. FileWinch feeds it broken files on purpose.
min_version = "102.0"
cve = "CVE-2026-90783"
packages = { apt = "mkvtoolnix", dnf = "mkvtoolnix", zypper = "mkvtoolnix", pacman = "mkvtoolnix-cli" }

[tools.mkvinfo]
required = false
feature = "MKV inspect and rebuild"
binaries = ["mkvinfo"]
version_cmd = ["mkvinfo", "--version"]
version_re = 'v(\d+\.\d+(?:\.\d+)?)'
min_version = "102.0"
cve = "CVE-2026-90783"
packages = { apt = "mkvtoolnix", dnf = "mkvtoolnix", zypper = "mkvtoolnix", pacman = "mkvtoolnix-cli" }

[tools.mkvextract]
required = false
feature = "MKV inspect and rebuild"
binaries = ["mkvextract"]
version_cmd = ["mkvextract", "--version"]
version_re = 'v(\d+\.\d+(?:\.\d+)?)'
min_version = "102.0"
cve = "CVE-2026-90783"
packages = { apt = "mkvtoolnix", dnf = "mkvtoolnix", zypper = "mkvtoolnix", pacman = "mkvtoolnix-cli" }

[tools.untrunc]
