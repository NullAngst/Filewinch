# Codecs the recipes need from ffmpeg. Missing ones mark ffmpeg as limited.
[ffmpeg_codecs]
decoders = ["h264", "hevc", "ac3", "mpeg2video", "mpeg4", "aac", "mp3"]
encoders = ["ffv1", "libx264", "libx265"]
