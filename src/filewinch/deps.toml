packages = { apt = "", dnf = "gpac", zypper = "", pacman = "gpac" }
upstream_note = "Not in the Debian, Ubuntu or openSUSE main repositories. On openSUSE install gpac from Packman; on Debian or Ubuntu download the .deb from gpac.io/downloads."

[tools.tsanalyze]
