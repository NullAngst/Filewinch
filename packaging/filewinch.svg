<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- A winch drum hauling a file up on its cable. -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#1f2a2f"/>
  <!-- frame -->
  <rect x="40" y="58" width="16" height="74" rx="4" fill="#8a9aa3"/>
  <rect x="200" y="58" width="16" height="74" rx="4" fill="#8a9aa3"/>
  <rect x="34" y="124" width="188" height="14" rx="5" fill="#6d7d86"/>
  <!-- drum -->
  <rect x="56" y="62" width="144" height="56" rx="12" fill="#43b3a0"/>
  <g stroke="#2a7d70" stroke-width="5" stroke-linecap="round">
    <line x1="76" y1="66" x2="76" y2="114"/>
    <line x1="96" y1="66" x2="96" y2="114"/>
    <line x1="116" y1="66" x2="116" y2="114"/>
    <line x1="136" y1="66" x2="136" y2="114"/>
    <line x1="156" y1="66" x2="156" y2="114"/>
    <line x1="176" y1="66" x2="176" y2="114"/>
  </g>
  <!-- crank -->
  <circle cx="208" cy="90" r="9" fill="#d9a54a"/>
  <rect x="204" y="38" width="8" height="54" rx="4" fill="#d9a54a"/>
  <rect x="204" y="34" width="26" height="10" rx="5" fill="#d9a54a"/>
  <!-- cable -->
  <line x1="128" y1="118" x2="128" y2="160" stroke="#d6dde1" stroke-width="5"/>
  <!-- hook ring -->
  <circle cx="128" cy="164" r="7" fill="none" stroke="#d6dde1" stroke-width="4"/>
  <!-- file -->
  <path d="M96 172 h48 l20 20 v40 a6 6 0 0 1 -6 6 h-62 a6 6 0 0 1 -6 -6 v-54 a6 6 0 0 1 6 -6 z" fill="#f2f4f5"/>
  <path d="M144 172 v20 h20 z" fill="#c4ccd1"/>
  <g stroke="#9aa7ae" stroke-width="5" stroke-linecap="round">
    <line x1="104" y1="204" x2="152" y2="204"/>
    <line x1="104" y1="218" x2="140" y2="218"/>
  </g>
</svg>
